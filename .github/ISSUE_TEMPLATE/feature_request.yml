name: Feature request
description: Propose a capability this library does not have
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot be done today, stated as a real use rather than a solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behaviour you have in mind.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Why it belongs here
      description: >
        Each engine states anti-goals in its README. Say why this is in scope
        rather than a layer above.
    validations:
      required: true
